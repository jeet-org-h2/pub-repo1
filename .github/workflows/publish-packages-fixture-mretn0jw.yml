name: Publish package fixture
on:
  push:
    branches:
      - godisinhell-patch-1
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: '@jeet-org-h2'
      - name: Build disposable package
        run: |
          mkdir -p fixture-package
          cat > fixture-package/package.json <<'EOF'
          {"name":"@jeet-org-h2/codex-packages-fixture-mretn0jw","version":"1.0.0","description":"Disposable API test fixture","repository":{"type":"git","url":"git+https://github.com/jeet-org-h2/pub-repo1.git"},"publishConfig":{"registry":"https://npm.pkg.github.com"}}
          EOF
          echo "module.exports = {};" > fixture-package/index.js
      - name: Publish fixture
        working-directory: fixture-package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
