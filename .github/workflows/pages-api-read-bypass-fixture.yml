name: Pub repo Pages API fixture

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Build slow disposable Pages artifact
        run: |
          mkdir -p _site
          printf '<!doctype html><title>Pub repo Pages API fixture</title>\n' > _site/index.html
          for i in $(seq 1 50000); do printf 'x' > "_site/file-$i.txt"; done

      - name: Upload disposable Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 1

      - name: Capture API fixture values
        shell: bash
        run: |
          OIDC_JSON="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_JSON}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          OIDC_B64="$(printf '%s' "${OIDC_TOKEN}" | base64 -w0)"
          echo "FIXTURE_ARTIFACT_ID=${{ steps.upload.outputs.artifact_id }}"
          echo "FIXTURE_BUILD_VERSION=${GITHUB_SHA}"
          echo "FIXTURE_OIDC_B64=${OIDC_B64}"

      - name: Keep manual cancellation window open
        run: sleep 60

