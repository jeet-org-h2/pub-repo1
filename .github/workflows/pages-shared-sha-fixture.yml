name: Shared SHA Pages fixture

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

jobs:
  fixture:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Build disposable Pages artifact
        run: |
          mkdir -p _site
          printf '<!doctype html><title>shared-sha-fixture</title>\n' > _site/index.html
      - name: Upload disposable Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Capture API fixture values
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          OIDC_JSON="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf 'FIXTURE_ARTIFACT_ID=%s\n' "$ARTIFACT_ID"
          printf 'FIXTURE_BUILD_VERSION=%s\n' "$GITHUB_SHA"
          printf 'FIXTURE_OIDC_B64=%s\n' "$(printf '%s' "$OIDC_TOKEN" | base64 -w 0)"
      - name: Keep fixture window open
        run: sleep 60
